image: dockette/php:8.4

stages:
  - test

before_script:
  - chmod +x /usr/local/bin/composer
  - composer --version
  - cd src
  - composer install --prefer-dist --no-interaction --no-progress

test-composer:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_send"'
  script:
    - composer tester

test-phpstan:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_send"'
  script:
    - composer phpstan