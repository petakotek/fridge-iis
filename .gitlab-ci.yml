image: dockette/php:8.4

stages:
  - test

before_script:
  - chmod +x /usr/local/bin/composer
  - composer --version
  - cd src
  - composer install --prefer-dist --no-interaction --no-progress

test-composer:
  stage: test
  script:
    - composer tester

test-phpstan:
  stage: test
  script:
    - composer phpstan