ServerName localhost

<VirtualHost *:80>
    DocumentRoot "/usr/local/apache2/htdocs"

    # Production exposes the assigned WWW directory through Apache UserDir.
    RedirectMatch 302 "^/$" "/~xvoldrv00/"
    RedirectMatch 302 "^/~xvoldrv00$" "/~xvoldrv00/"
    Alias "/~xvoldrv00/" "/var/www/html/"

    <Directory "/var/www/html">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # The PHP container sees the source tree at the same absolute path.
    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://php:9000"
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
