name: iis-project-2026

services:
  web:
    build:
      context: .
      dockerfile: apache/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ../src:/var/www/html:ro
    depends_on:
      php:
        condition: service_healthy

  php:
    build:
      context: .
      dockerfile: php/Dockerfile
    restart: unless-stopped
    user: "${PHP_USER_ID:-1000}:${PHP_GROUP_ID:-1000}"
    working_dir: /var/www/html
    volumes:
      - ../src:/var/www/html
    environment:
      COMPOSER_HOME: /tmp/composer
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  database:
    image: mariadb:11.8.8
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-33060}:3306"
    environment:
      MARIADB_DATABASE: "${DB_NAME:-xvoldrv00}"
      MARIADB_USER: "${DB_USER:-iis}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-iis}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  database-data:
